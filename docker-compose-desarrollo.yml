# Use postgres/example user/password credentials

services:
  app:
    build:
      dockerfile: Dockerfile
      context: .
    image: parcial-2-app
    restart: "no"
    container_name: parcial-2-app
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin


  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"


